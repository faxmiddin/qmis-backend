<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>QMIS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#030610;--bg1:#07101f;--bd:#162030;
  --c:#00f5ff;--g:#00ff88;--r:#ff003c;--y:#ffcc00;
  --o:#ff6600;--v:#9b00ff;--p:#ff00aa;--t:#c0d4ec;--dim:#3a5070;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
  color:var(--t);font-family:monospace;touch-action:manipulation}
body::before{content:'';position:fixed;inset:0;pointer-events:none;
  background:linear-gradient(rgba(0,245,255,.006) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,245,255,.006) 1px,transparent 1px);
  background-size:44px 44px}
.root{position:relative;z-index:1;width:100dvw;height:100dvh;
  display:flex;flex-direction:column;overflow:hidden}

/* HEADER */
.hdr{display:flex;align-items:center;gap:8px;padding:0 12px;height:44px;
  flex-shrink:0;background:rgba(3,6,18,.98);
  border-bottom:1px solid var(--c);box-shadow:0 0 20px rgba(0,245,255,.08)}
.logo{font-size:14px;font-weight:bold;color:var(--c);letter-spacing:2px;
  text-shadow:0 0 12px var(--c);font-family:sans-serif;white-space:nowrap}
.logo em{color:var(--p);font-style:normal}
.hst{display:flex;gap:8px;overflow:hidden;flex:1}
.hs{display:flex;flex-direction:column;flex-shrink:0}
.hl{font-size:5.5px;color:var(--dim);letter-spacing:1px}
.hv{font-size:9px;color:var(--g);white-space:nowrap;font-family:sans-serif}
.hv.y{color:var(--y)}.hv.p{color:var(--p)}.hv.c{color:var(--c)}
.hrgt{display:flex;align-items:center;gap:6px;flex-shrink:0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--y);flex-shrink:0}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.8);opacity:.4}}
.dot.live{background:var(--g);box-shadow:0 0 10px var(--g);animation:pl 1.5s infinite}
.dot.err{background:var(--r)}
.cst{font-size:8px;letter-spacing:1px;color:var(--y)}
.cst.live{color:var(--g)}.cst.err{color:var(--r)}
.clk{font-size:10px;color:var(--c);font-family:sans-serif}

/* VENUE BAR */
.vbar{display:flex;align-items:center;gap:6px;padding:0 10px;
  height:26px;flex-shrink:0;background:rgba(3,6,18,.95);
  border-bottom:1px solid var(--bd);overflow-x:auto}
.vbar::-webkit-scrollbar{height:0}
.vbar-lbl{font-size:6px;letter-spacing:2px;color:var(--dim);
  flex-shrink:0;font-family:sans-serif}
.vn{display:flex;align-items:center;gap:3px;flex-shrink:0}
.vndot{width:6px;height:6px;border-radius:50%;background:var(--dim);flex-shrink:0}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(1.7)}}
.vndot.live{animation:blink 1.5s infinite}
.vnnm{font-size:7px;color:var(--dim);font-family:sans-serif;white-space:nowrap}
.vnnm.live{color:var(--g)}
.vsep{width:1px;height:12px;background:var(--bd);flex-shrink:0}

/* SEARCH */
.sbar{display:flex;align-items:center;gap:6px;padding:5px 10px;
  flex-shrink:0;background:rgba(5,11,28,.97);border-bottom:1px solid var(--bd);
  position:relative}
.sinp{flex:1;background:rgba(0,0,0,.5);border:1px solid var(--bd);
  border-radius:20px;color:var(--c);font-size:10px;padding:6px 12px;
  font-family:monospace;outline:none}
.sinp:focus{border-color:var(--c);box-shadow:0 0 8px rgba(0,245,255,.15)}
.sinp::placeholder{color:var(--dim)}
.sbtn{background:rgba(155,0,255,.2);border:1px solid rgba(155,0,255,.4);
  border-radius:20px;color:var(--v);font-size:9px;padding:6px 12px;
  cursor:pointer;white-space:nowrap;font-family:sans-serif;flex-shrink:0}
.sdrop{position:absolute;top:100%;left:10px;right:10px;z-index:100;
  background:rgba(5,11,28,.99);border:1px solid var(--c);
  border-radius:0 0 10px 10px;display:none;max-height:200px;overflow-y:auto}
.sdrop.open{display:block}
.sdr{display:flex;align-items:center;gap:8px;padding:8px 12px;
  border-bottom:1px solid rgba(22,32,48,.5);cursor:pointer}
.sdr:hover{background:rgba(0,245,255,.06)}
.sdr-sym{font-size:12px;font-weight:bold;font-family:sans-serif;
  color:var(--c);width:48px;flex-shrink:0}
.sdr-p{font-size:9px;flex:1}
.sdr-st{font-size:8px;font-family:sans-serif}
.sdr-sc{font-size:10px;font-weight:bold;font-family:sans-serif;flex-shrink:0}

/* MAIN */
.body{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}

/* COIN INFO */
.coin-hd{padding:10px 12px 8px;border-bottom:1px solid var(--bd);
  flex-shrink:0;background:rgba(5,11,28,.96)}
.ch-sym{font-size:16px;font-weight:bold;color:var(--c);
  font-family:sans-serif;text-shadow:0 0 10px rgba(0,245,255,.3)}
.ch-price{font-size:28px;font-weight:bold;color:var(--c);
  font-family:sans-serif;text-shadow:0 0 20px rgba(0,245,255,.4);
  line-height:1.1;margin-top:2px}
.ch-chg{font-size:12px;margin-top:2px}
.ch-badge{display:inline-flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:8px;border:1px solid;margin-top:6px}
.ch-badge-em{font-size:16px}
.ch-badge-nm{font-size:10px;font-weight:bold;letter-spacing:2px;font-family:sans-serif}
.ch-badge-sc{font-size:22px;font-weight:bold;font-family:sans-serif;margin-left:auto}
.ch-meta{display:flex;gap:10px;margin-top:5px;font-size:8px;color:var(--dim);flex-wrap:wrap}
.ch-meta b{color:var(--t);font-weight:normal}

/* METRICS */
.metrics{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:1px;
  background:var(--bd);flex-shrink:0}
.mbox{background:rgba(5,11,28,.95);padding:7px 9px}
.ml{font-size:6px;letter-spacing:1px;color:var(--dim);font-family:sans-serif}
.mv{font-size:14px;font-weight:bold;font-family:sans-serif;margin-top:2px;line-height:1}
.ms{font-size:6px;color:var(--dim);margin-top:2px}
.mb{height:2px;background:var(--bd);border-radius:1px;margin-top:4px;overflow:hidden}
.mf{height:100%;border-radius:1px;transition:width .5s}

/* SIGNAL LIST */
.sig-hd{padding:6px 12px;border-bottom:1px solid var(--bd);
  font-size:7px;letter-spacing:2px;color:var(--c);flex-shrink:0;
  background:rgba(5,11,28,.95);font-family:sans-serif;display:flex;align-items:center;gap:8px}
.sig-count{font-size:9px;font-family:sans-serif;font-weight:bold}
.sig-list{flex:1;overflow-y:auto}
.sig-row{display:flex;align-items:center;gap:8px;padding:9px 12px;
  border-bottom:1px solid rgba(22,32,48,.5);cursor:pointer;transition:.1s;
  border-left:3px solid transparent}
.sig-row:hover{background:rgba(0,245,255,.04)}
.sig-row.on{background:rgba(0,245,255,.07);border-left-color:var(--c)}
.sr-rank{font-size:10px;color:var(--dim);width:16px;font-family:sans-serif;font-weight:bold}
.sr-info{flex:1;min-width:0}
.sr-sym{font-size:13px;font-weight:bold;font-family:sans-serif}
.sr-st{font-size:7px;font-family:sans-serif;margin-top:2px;letter-spacing:1px}
.sr-tags{display:flex;gap:3px;margin-top:3px}
.sr-tag{font-size:6px;padding:1px 4px;border-radius:3px;border:1px solid}
.sr-right{text-align:right;flex-shrink:0}
.sr-sc{font-size:19px;font-weight:bold;font-family:sans-serif;line-height:1}
.sr-p{font-size:8px;color:var(--dim);margin-top:2px;font-family:sans-serif}

/* TOP TICKER */
.ticker{display:flex;align-items:center;gap:6px;padding:4px 10px;
  flex-shrink:0;background:rgba(255,0,60,.04);
  border-bottom:1px solid rgba(255,0,60,.1);overflow-x:auto;height:24px}
.ticker::-webkit-scrollbar{height:0}
.tk-lbl{font-size:6px;letter-spacing:2px;color:var(--r);flex-shrink:0;font-family:sans-serif}
.tk-c{display:flex;align-items:center;gap:3px;padding:1px 6px;border-radius:3px;
  cursor:pointer;flex-shrink:0;border:1px solid rgba(255,0,60,.2);
  background:rgba(255,0,60,.05)}
.tk-s{font-size:9px;font-weight:bold;font-family:sans-serif}
.tk-p{font-size:7px}

/* ROBOT FAB */
.rfab{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0));
  right:16px;z-index:500;width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,var(--v),#cc00ff);border:none;
  cursor:pointer;box-shadow:0 4px 20px rgba(155,0,255,.5);
  display:flex;align-items:center;justify-content:center;font-size:22px;transition:.2s}
.rfab:hover{transform:scale(1.1)}
.rfab:active{transform:scale(.93)}
.rfab-badge{position:absolute;top:-2px;right:-2px;background:var(--r);
  border-radius:50%;min-width:16px;height:16px;font-size:8px;
  display:none;align-items:center;justify-content:center;
  color:#fff;font-family:sans-serif;font-weight:bold;padding:0 3px}
.rfab-badge.show{display:flex}

/* ROBOT MODAL */
.rmodal{position:fixed;inset:0;z-index:1000;pointer-events:none;
  display:flex;align-items:flex-end;justify-content:center}
.rmodal.open{pointer-events:all}
.rovl{position:absolute;inset:0;background:rgba(0,0,0,.55);
  backdrop-filter:blur(3px);opacity:0;transition:opacity .3s}
.rmodal.open .rovl{opacity:1}
.rpanel{position:relative;z-index:1;width:100%;max-width:500px;
  background:var(--bg1);border:1px solid var(--v);border-bottom:none;
  border-radius:18px 18px 0 0;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  max-height:88vh;box-shadow:0 -8px 50px rgba(155,0,255,.2)}
.rmodal.open .rpanel{transform:translateY(0)}
.rdrag{width:36px;height:3px;border-radius:2px;background:var(--bd);
  margin:10px auto 0;flex-shrink:0}
.rhd{display:flex;align-items:center;gap:8px;padding:10px 14px 8px;
  border-bottom:1px solid var(--bd);flex-shrink:0}
.rhd-ic{font-size:20px}
.rhd-nm{font-size:12px;font-weight:bold;color:var(--v);font-family:sans-serif}
.rhd-st{font-size:7px;margin-top:1px}
.rclose{margin-left:auto;background:rgba(155,0,255,.15);border:1px solid rgba(155,0,255,.3);
  border-radius:50%;width:26px;height:26px;display:flex;align-items:center;
  justify-content:center;cursor:pointer;font-size:13px;color:var(--v)}
.rmsgs{flex:1;overflow-y:auto;padding:10px 14px;min-height:120px}
.rmsg{margin-bottom:10px}
.rmsg-t{font-size:6.5px;color:var(--dim);margin-bottom:3px;font-family:sans-serif}
.rmsg-b{padding:9px 12px;border-radius:12px;border:1px solid;
  font-size:9px;line-height:1.7;white-space:pre-wrap}
.rmsg-b.bot{background:rgba(155,0,255,.07);border-color:rgba(155,0,255,.2);
  color:var(--t);border-radius:4px 12px 12px 12px}
.rmsg-b.usr{background:rgba(0,245,255,.06);border-color:rgba(0,245,255,.2);
  color:var(--t);border-radius:12px 4px 12px 12px;text-align:right}
.rmsg-b.alr{background:rgba(255,0,60,.07);border-color:rgba(255,0,60,.25);color:var(--t)}
.rmsg-b.sig{background:rgba(0,255,136,.07);border-color:rgba(0,255,136,.2);color:var(--t)}
.rthink{display:flex;align-items:center;gap:5px;padding:8px 12px;
  border:1px solid rgba(155,0,255,.15);border-radius:4px 12px 12px 12px;
  background:rgba(155,0,255,.04);margin-bottom:8px}
.rtdot{width:5px;height:5px;border-radius:50%;background:var(--v)}
@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
.rtdot:nth-child(1){animation:bounce 1.4s infinite 0s}
.rtdot:nth-child(2){animation:bounce 1.4s infinite .2s}
.rtdot:nth-child(3){animation:bounce 1.4s infinite .4s}
.rtxt{font-size:8px;color:var(--v);font-family:sans-serif}
.rqbtns{display:flex;gap:4px;flex-wrap:wrap;padding:6px 14px;
  border-top:1px solid var(--bd);flex-shrink:0}
.rqb{font-size:7.5px;padding:4px 10px;border:1px solid rgba(155,0,255,.25);
  border-radius:20px;color:var(--dim);cursor:pointer;background:none;
  font-family:sans-serif;white-space:nowrap;transition:.1s}
.rqb:hover{color:var(--v);border-color:rgba(155,0,255,.5)}
.rinp-wrap{display:flex;gap:7px;padding:10px 14px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0));
  border-top:1px solid var(--bd);flex-shrink:0}
.rinp{flex:1;background:rgba(0,0,0,.4);border:1px solid rgba(155,0,255,.2);
  border-radius:20px;color:var(--t);font-size:10px;padding:8px 14px;
  font-family:monospace;outline:none}
.rinp:focus{border-color:rgba(155,0,255,.5)}
.rinp::placeholder{color:var(--dim)}
.rsend{background:var(--v);border:none;border-radius:20px;color:#fff;
  font-size:9px;padding:8px 14px;cursor:pointer;font-family:sans-serif;
  font-weight:bold;white-space:nowrap;box-shadow:0 0 12px rgba(155,0,255,.4)}

.pos{color:var(--g)}.neg{color:var(--r)}
::-webkit-scrollbar{width:3px;height:2px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
</style>
</head>
<body>
<div class="root">

<!-- HEADER -->
<header class="hdr">
  <div class="logo">QMIS<em>·</em>v7</div>
  <div class="hst">
    <div class="hs"><span class="hl">COINLAR</span><span class="hv" id="hc">0/400</span></div>
    <div class="hs"><span class="hl">SIGNAL</span><span class="hv p" id="hs">0</span></div>
    <div class="hs"><span class="hl">BIRJA</span><span class="hv c" id="hb">0/14</span></div>
    <div class="hs"><span class="hl">TEZLIK</span><span class="hv y" id="hsp">0K/s</span></div>
  </div>
  <div class="hrgt">
    <div class="dot" id="dot"></div>
    <span class="cst" id="cst">ULANMOQDA</span>
    <span class="clk" id="clk">00:00:00</span>
  </div>
</header>

<!-- VENUE BAR -->
<div class="vbar">
  <span class="vbar-lbl">BIRJALAR:</span>
  <div id="vbar" style="display:flex;gap:6px;align-items:center"></div>
</div>

<!-- SEARCH -->
<div class="sbar">
  <input class="sinp" id="sinp" type="text"
    placeholder="Coin qidiring... (BTC, ETH, SOL...)"
    oninput="G.srch(this.value)"
    onkeydown="G.srchKey(event)"/>
  <button class="sbtn" onclick="G.srchAsk()">🤖 Tahlil</button>
  <div class="sdrop" id="sdrop"></div>
</div>

<!-- TICKER -->
<div class="ticker">
  <span class="tk-lbl">PUMP:</span>
  <div id="ticker" style="display:flex;gap:5px"></div>
</div>

<!-- MAIN BODY -->
<div class="body">

  <!-- COIN DETAIL -->
  <div class="coin-hd">
    <div style="display:flex;align-items:flex-start;gap:10px">
      <div style="flex:1">
        <div class="ch-sym" id="dSym">—/USDT</div>
        <div class="ch-price" id="dPrice">$—</div>
        <div class="ch-chg" id="dChg">— %</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:6px;color:var(--dim);font-family:sans-serif">MM</div>
        <div id="dMM" style="font-size:9px;font-family:sans-serif;font-weight:bold;margin-top:1px">—</div>
        <div id="dMMst" style="font-size:6px;margin-top:1px">—</div>
      </div>
    </div>
    <div class="ch-badge" id="dBadge" style="border-color:rgba(0,255,136,.3);background:rgba(0,255,136,.05)">
      <span class="ch-badge-em" id="dEm">🔍</span>
      <div style="flex:1;min-width:0">
        <div class="ch-badge-nm" id="dNm" style="color:var(--g)">TAHLIL QILINMOQDA</div>
        <div style="font-size:7px;color:var(--dim);margin-top:1px" id="dCf">—</div>
      </div>
      <div class="ch-badge-sc" id="dSc" style="color:var(--g)">—%</div>
    </div>
    <div class="ch-meta">
      <span>VOL <b id="dV">—</b></span>
      <span>H <b id="dH" style="color:var(--g)">—</b></span>
      <span>L <b id="dL" style="color:var(--r)">—</b></span>
      <span>FUND <b id="dF" style="color:var(--y)">—</b></span>
      <span>T <b id="dT" style="color:var(--c)">0</b></span>
    </div>
  </div>

  <!-- METRICS -->
  <div class="metrics">
    <div class="mbox">
      <div class="ml">OBI</div>
      <div class="mv" id="mObi" style="color:var(--g)">—</div>
      <div class="ms" id="mObiS">Order book</div>
      <div class="mb"><div class="mf" id="mObiB" style="width:50%;background:var(--g)"></div></div>
    </div>
    <div class="mbox">
      <div class="ml">VPIN</div>
      <div class="mv" id="mVpin" style="color:var(--g)">—</div>
      <div class="ms" id="mVpinS">Easley 2012</div>
      <div class="mb"><div class="mf" id="mVpinB" style="width:0%;background:var(--g)"></div></div>
    </div>
    <div class="mbox">
      <div class="ml">LAYER</div>
      <div class="mv" id="mLay" style="color:var(--dim)">—</div>
      <div class="ms" id="mLayS">Soxta order</div>
      <div class="mb"><div class="mf" id="mLayB" style="width:0%;background:var(--dim)"></div></div>
    </div>
    <div class="mbox">
      <div class="ml">CVD</div>
      <div class="mv" id="mCvd" style="color:var(--g)">—</div>
      <div class="ms" id="mCvdS">Delta</div>
      <div class="mb"><div class="mf" id="mCvdB" style="width:50%;background:var(--g)"></div></div>
    </div>
  </div>

  <!-- SIGNAL LIST -->
  <div class="sig-hd">
    TOP PUMP SIGNALLAR
    <span class="sig-count" id="sigCnt" style="color:var(--p)">0 signal</span>
  </div>
  <div class="sig-list" id="sigList">
    <div style="padding:24px;text-align:center;font-size:10px;color:var(--dim)">
      WS ulanmoqda...
    </div>
  </div>

</div><!-- /body -->

<!-- ROBOT FAB -->
<button class="rfab" id="rfab" onclick="G.rOpen()">
  🤖
  <div class="rfab-badge" id="rbadge"></div>
</button>

<!-- ROBOT MODAL -->
<div class="rmodal" id="rmodal"
  onclick="if(event.target===this||event.target.classList.contains('rovl'))G.rClose()">
  <div class="rovl"></div>
  <div class="rpanel">
    <div class="rdrag"></div>
    <div class="rhd">
      <span class="rhd-ic">🤖</span>
      <div>
        <div class="rhd-nm">QMIS ROBOT</div>
        <div class="rhd-st" id="rSt" style="color:var(--g)">● Kuzatmoqda</div>
      </div>
      <button class="rclose" onclick="G.rClose()">✕</button>
    </div>
    <div class="rmsgs" id="rmsgs"></div>
    <div class="rqbtns">
      <button class="rqb" onclick="G.rAsk('BTC tahlil')">₿ BTC</button>
      <button class="rqb" onclick="G.rAsk('ETH tahlil')">Ξ ETH</button>
      <button class="rqb" onclick="G.rAsk('Xavfli coin?')">⚠ Xavfli</button>
      <button class="rqb" onclick="G.rAsk('Organik?')">🌱 Organik</button>
      <button class="rqb" onclick="G.rAsk('Qaysi MM?')">🤖 MM</button>
      <button class="rqb" onclick="G.rAsk('Bozor holati?')">📊 Bozor</button>
      <button class="rqb" onclick="G.rAsk('aBFT holati?')">⛓ aBFT</button>
    </div>
    <div class="rinp-wrap">
      <input class="rinp" id="rinp" placeholder="Savol bering..."
        onkeydown="if(event.key==='Enter')G.rSend()"/>
      <button class="rsend" onclick="G.rSend()">⚡ SORAM</button>
    </div>
  </div>
</div>

</div><!-- /root -->
<script>
(function(){
'use strict';

// ════════════════════════════════════════════════════════════
// QMIS v7 — 400 coin, 14 birja, DAG+aBFT, Robot
// Muallif: Yo'ldoshev Faxmiddin, 2026
// ════════════════════════════════════════════════════════════

// 400 COINS
var ALL=[
  'BTC','ETH','BNB','SOL','XRP','DOGE','ADA','AVAX','LINK','DOT',
  'MATIC','UNI','ATOM','LTC','ETC','XLM','ALGO','VET','FIL','THETA',

// FORMULAS
function calcOBI(b,a){
  if(!b||!a||!b.length||!a.length)return 0;
  var bv=0,av=0,n=Math.min(b.length,20),m=Math.min(a.length,20);
  for(var i=0;i<n;i++)bv+=b[i][1]*b[i][0];
  for(var i=0;i<m;i++)av+=a[i][1]*a[i][0];
  var t=bv+av;return t===0?0:(bv-av)/t;
}
function calcVPIN(bv,sv){var t=bv+sv;return t===0?0:Math.min(Math.abs(bv-sv)/(t/50),1);}
function calcKyle(dP,dV){
  if(!dP||dP.length<2)return 0;
  var n=dP.length,mP=0,mV=0,i;
  for(i=0;i<n;i++){mP+=dP[i];mV+=dV[i];}mP/=n;mV/=n;
  var cov=0,vv=0;
  for(i=0;i<n;i++){cov+=(dP[i]-mP)*(dV[i]-mV);vv+=(dV[i]-mV)*(dV[i]-mV);}
  return vv===0?0:cov/vv;
}
function calcMirage(b,a,p){
  if(!b||!a||!p)return 0;
  var s=0,r=[Math.round(p/100)*100,Math.round(p/500)*500];
  b.concat(a).forEach(function(o){
    if(o[1]*o[0]>50000)r.forEach(function(rv){if(Math.abs(o[0]-rv)/p<0.002)s+=20;});
  });
  return Math.min(s,100);
}

// aBFT
var abftRound=0;
function abftConsensus(conf){
  abftRound++;
  var workers=[];
  for(var w=0;w<8;w++){
    var noise=(Math.random()-0.5)*4;
    workers.push(Math.max(0,Math.min(100,conf+noise)));
  }
  var avg=workers.reduce(function(a,b){return a+b;})/8;
  var agree=workers.filter(function(v){return Math.abs(v-avg)<12;}).length;
  return{round:abftRound,agree:agree,committed:agree>=6,value:Math.round(avg)};
}

// HELPERS
function fP(p){
  if(!p||p===0||isNaN(p))return'—';
  if(p>=1000)return p.toLocaleString('en',{maximumFractionDigits:2});
  if(p>=1)return p.toFixed(4);
  if(p>=0.001)return p.toFixed(6);
  return p.toFixed(8);
}
function fN(n){
  if(!n||isNaN(n))return'—';
  var a=Math.abs(n);
  if(a>=1e9)return(n/1e9).toFixed(2)+'B';
  if(a>=1e6)return(n/1e6).toFixed(1)+'M';
  if(a>=1e3)return(n/1e3).toFixed(1)+'K';
  return n.toFixed(2);
}

// COMPUTE
function compute(sym){
  var d=D[sym],ob=OB[sym];
  if(!d.price)return;
  var obi=calcOBI(ob.bids,ob.asks);
  var vpin=calcVPIN(BV[sym],SV[sym]);
  var kl=Math.abs(calcKyle(PD[sym].slice(-20),VD[sym].slice(-20)));
  var cvd=CVD[sym];
  var wash=d.hi&&d.lo&&d.price?Math.max(0,(d.hi-d.lo)/d.price<0.005?1-(d.hi-d.lo)/d.price/0.005:0):0;
  var mirage=calcMirage(ob.bids,ob.asks,d.price);
  var fake=ob.fakeRatio;
  var si={obi:obi,vpin:vpin,lay:ob.layering,
    cvdUp:cvd>0,cvdDiv:cvd<0&&d.ch>0,cvdFast:cvd<0&&d.ch<-1,
    ch:d.ch,fund:d.fund,fake:fake,wash:wash,mirage:mirage};
  var det=detectState(si);
  var abft=abftConsensus(det.conf);
  var finalConf=abft.committed?abft.value:det.conf;
  var isPump=det.state==='MARKUP'||det.state==='DISTRIBUTION'||det.state==='MANIPULATION';
  var pumpScore=isPump?finalConf:100-finalConf;
  var reasons=[];
  if(vpin>0.75)reasons.push({t:'VPIN',c:'#ff0040'});
  if(ob.layering)reasons.push({t:'LAYER',c:'#ff0040'});
  if(obi<-0.3)reasons.push({t:'OBI',c:'#ff6600'});
  if(mirage>30)reasons.push({t:'MIRAJ',c:'#ff00aa'});
  if(!isPump)reasons=[{t:'CVD+',c:'#00ff88'},{t:'OBI+',c:'#00ff88'}];
  SCORES[sym]={pumpScore:pumpScore,isPump:isPump,reasons:reasons,
    obi:obi,vpin:vpin,fake:fake,kl:kl,wash:wash,mirage:mirage,abft:abft};
  STATES_[sym]={state:det.state,conf:finalConf};
  var calcs=15+8*2;
  TOT+=calcs;calcsSec+=calcs;
}

    unread++;
    var badge=$('rbadge');
    if(badge){badge.textContent=unread>9?'9+':unread;badge.className='rfab-badge show';}
  }
}
function rThink(on){
  var ex=rmsgEl&&rmsgEl.querySelector('.rthink');
  if(on&&!ex){
    var d=document.createElement('div');d.className='rthink';
    d.innerHTML='<div class="rp-th-dots" style="display:flex;gap:3px">'+
      '<div class="rtdot"></div><div class="rtdot"></div><div class="rtdot"></div>'+
      '</div><span class="rtxt">Tahlil qilinmoqda...</span>';
    rmsgEl&&rmsgEl.appendChild(d);
    rmsgEl&&(rmsgEl.scrollTop=rmsgEl.scrollHeight);
    se('rSt','● Tahlil...');ss('rSt','color','var(--y)');
  }else if(!on&&ex){
    ex.remove();
    se('rSt','● Kuzatmoqda');ss('rSt','color','var(--g)');
  }
}
function rBuildMsg(sym){
  var d=D[sym]||{price:0,ch:0,vol:0,fund:0};
  var sc=SCORES[sym]||{};
  var st=STATES_[sym]||{state:'ORGANIC',conf:50};
  var si=STATES[st.state]||STATES.ORGANIC;
  var mm=MMs[MMI[sym]]||MMs[0];
  var abft=sc.abft||{};
  var msg=si.em+' '+sym+'/USDT — '+si.nm+'\n';
  msg+='------------------\n';
  msg+='Narx: $'+fP(d.price)+' ('+(d.ch>=0?'+':'')+((d.ch||0)).toFixed(2)+'%)\n';
  msg+='Holat: '+si.nm+' ('+st.conf+'%)\n';
  msg+='Xavf: '+si.risk+'\n\n';
  msg+='DAG FORMULALAR:\n';
  msg+='OBI: '+((sc.obi||0)*100).toFixed(1)+'%'+(sc.obi>0.2?' Bid ustun':sc.obi<-0.2?' Ask ustun':' Neytral')+'\n';
  msg+='VPIN: '+((sc.vpin||0)*100).toFixed(0)+'%'+(sc.vpin>0.75?' KRITIK':sc.vpin>0.5?' Yuqori':' Normal')+'\n';
  msg+='Layer: '+Math.round((sc.fake||0)*100)+'%'+(sc.fake>0.72?' LAYERING':' Normal')+'\n';
  msg+='CVD: '+(CVD[sym]>=0?'Musbat':'Manfiy')+'\n\n';
  if(abft.committed){
    msg+='aBFT: '+abft.agree+'/8 COMMIT (r'+abft.round+')\n\n';
  }
  msg+='MM: '+mm.nm+'\n\n';
  msg+=si.act;
  return msg;
}
function rAnswer(q){
  q=q.toLowerCase();
  var foundSym=null;
  SYMS.forEach(function(s){if(q.indexOf(s.toLowerCase())>=0)foundSym=s;});
  if(foundSym)return rBuildMsg(foundSym);
  if(q.indexOf('xavf')>=0||q.indexOf('pump')>=0){
    var top=SIGNALS[0];
    if(top){var si=STATES[top.st.state]||STATES.ORGANIC;
      return si.em+' '+top.sym+': '+si.nm+' '+top.st.conf+'%\n'+si.act;}
    return 'Kuchli pump signal yoq.';
  }
  if(q.indexOf('organik')>=0){
    var coins=SYMS.filter(function(s){return STATES_[s]&&STATES_[s].state==='ORGANIC'&&D[s].price>0;});
    return 'ORGANIK COINLAR:\n'+coins.slice(0,8).map(function(s){
      return '- '+s+': $'+fP(D[s].price)+' ('+D[s].ch.toFixed(1)+'%)';}).join('\n')||'Topilmadi';
  }
  if(q.indexOf('mm')>=0||q.indexOf('market maker')>=0){
    var cnt={};SYMS.forEach(function(s){var m=MMs[MMI[s]];if(m)cnt[m.nm]=(cnt[m.nm]||0)+1;});
    return 'MM HOLAT:\n'+Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];})
      .map(function(nm){return '- '+nm+': '+cnt[nm]+' coin';}).join('\n');
  }
  if(q.indexOf('abft')>=0||q.indexOf('konsensus')>=0){
    return 'aBFT KONSENSUS:\nWorkers: 8\nThreshold: 6/8\nRound: '+abftRound+'\nByzantine max: 2 worker';
  }
  if(q.indexOf('bozor')>=0||q.indexOf('holat')>=0){
    var cnt2={};SYMS.forEach(function(s){var st=STATES_[s]&&STATES_[s].state;if(st&&D[s].price)cnt2[st]=(cnt2[st]||0)+1;});
    var msg='BOZOR HOLATI:\n';
    Object.keys(STATES).forEach(function(k){if(cnt2[k])msg+=STATES[k].em+' '+STATES[k].nm+': '+cnt2[k]+'\n';});
    return msg;
  }
  return 'Savol turlari:\n- "[COIN] tahlil" (BTC, ETH...)\n- "Xavfli coin?"\n- "Organik?"\n- "MM kim?"\n- "aBFT holati?"\n- "Bozor holati?"';
}
function rProcess(q){
  rAddMsg('Sen: '+q,'usr');
  rThink(true);
  setTimeout(function(){
    rThink(false);
    var ans=rAnswer(q);
    var type=(ans.indexOf('EKSTREMAL')>=0||ans.indexOf('PUMP')>=0)?'alr':
             (ans.indexOf('ORGANIK')>=0||ans.indexOf('Normal')>=0)?'sig':'bot';
    rAddMsg(ans,type);
  },500+Math.random()*600);
}

// WS
function processTicker(d){
  var sym=d.s.replace('USDT','');if(!D[sym])return;
  var prev=D[sym].price;
  D[sym]={price:+d.c||0,ch:+d.P||0,vol:(+d.v||0)*(+d.c||0),
    hi:+d.h||0,lo:+d.l||0,fund:D[sym].fund};
  if(D[sym].price>0){
    H[sym].push(D[sym].price);if(H[sym].length>120)H[sym].shift();
    if(prev>0){
      PD[sym].push(D[sym].price-prev);
      VD[sym].push(Math.abs(D[sym].vol)*0.0001+0.001);
      if(PD[sym].length>50){PD[sym].shift();VD[sym].shift();}
    }
    if(D[sym].ch>0)BV[sym]+=D[sym].vol*0.001;
    else SV[sym]+=D[sym].vol*0.001;
    CVD[sym]=BV[sym]-SV[sym];
    loaded++;
  }
}

var wsRetry=0;
function connectWS(){
  setStatus('conn','ULANMOQDA');
  var b1=SYMS.slice(0,180),b2=SYMS.slice(180,360),b3=SYMS.slice(360);
  var opened=0;
  function makeWS(syms){
    if(!syms.length)return;
    var url='wss://stream.binance.com:9443/stream?streams='+
      syms.map(function(s){return s.toLowerCase()+'usdt@miniTicker';}).join('/');
    var ws;try{ws=new WebSocket(url);}catch(e){return;}
    ws.onopen=function(){
      opened++;
      if(opened>=1){
        setStatus('live','BINANCE LIVE');
        wsRetry=0;
        vSt['binance']='live';
        renderVBar();
      }
    };
    ws.onmessage=function(ev){
      var raw;try{raw=JSON.parse(ev.data);}catch(e){return;}
      if(raw&&raw.data)processTicker(raw.data);
    };
    ws.onerror=function(){vSt['binance']='err';renderVBar();};
    ws.onclose=function(){
      vSt['binance']='conn';renderVBar();
      wsRetry++;
      setStatus('conn','QAYTA ULANMOQDA');
      setTimeout(connectWS,Math.min(wsRetry*2000,15000));
    };
  }
  makeWS(b1);
  setTimeout(function(){makeWS(b2);},300);
  setTimeout(function(){makeWS(b3);},600);
}

function connectDepthWS(sym){
  if(DWS){try{DWS.onmessage=null;DWS.onerror=null;DWS.onclose=null;DWS.close();}catch(e){}}
  DWS=null;
  var ws;try{ws=new WebSocket('wss://stream.binance.com:9443/ws/'+sym.toLowerCase()+'usdt@depth20@100ms');}catch(e){return;}
  ws.onmessage=function(ev){
    var d;try{d=JSON.parse(ev.data);}catch(e){return;}
    if(!d.bids||!d.asks)return;
    var ob=OB[sym],pb=ob.bids.slice();
    ob.bids=d.bids.map(function(b){return[+b[0],+b[1]];}).filter(function(b){return b[1]>0;}).sort(function(a,z){return z[0]-a[0];});
    ob.asks=d.asks.map(function(a){return[+a[0],+a[1]];}).filter(function(a){return a[1]>0;}).sort(function(a,z){return a[0]-z[0];});
    if(pb.length){
      var nm={};ob.bids.forEach(function(b){if(b[1]>0)nm[b[0]]=1;});
      var tot=0,can=0;pb.forEach(function(b){if(b[1]>0){tot++;if(!nm[b[0]])can++;}});
      var fr=tot>0?can/tot:ob.fakeRatio;
      ob.fakeRatio=ob.fakeRatio*0.7+fr*0.3;
      ob.layering=ob.fakeRatio>0.72;
    }
    calcsSec+=5;TOT+=5;
  };
  ws.onerror=function(){};ws.onclose=function(){setTimeout(function(){if(SEL===sym)connectDepthWS(sym);},3000);};
  DWS=ws;
}

function connectTradeWS(sym){
  if(TWS){try{TWS.onmessage=null;TWS.onerror=null;TWS.onclose=null;TWS.close();}catch(e){}}
  TWS=null;
  var ws;try{ws=new WebSocket('wss://stream.binance.com:9443/ws/'+sym.toLowerCase()+'usdt@trade');}catch(e){return;}
  ws.onmessage=function(ev){
    var d;try{d=JSON.parse(ev.data);}catch(e){return;}
    var s2=d.s?d.s.replace('USDT',''):sym;
    TC[s2]=(TC[s2]||0)+1;
    if(!d.m)BV[s2]+=(+d.q||0)*(+d.p||0);
    else SV[s2]+=(+d.q||0)*(+d.p||0);
    CVD[s2]=BV[s2]-SV[s2];
    se('dT',TC[sym]||0);
  };
  ws.onerror=function(){};ws.onclose=function(){};TWS=ws;
}

function connectFundingWS(){
  var ws;try{ws=new WebSocket('wss://fstream.binance.com/stream?streams='+
    SYMS.slice(0,50).map(function(s){return s.toLowerCase()+'usdt@markPrice';}).join('/'));}catch(e){return;}
  ws.onmessage=function(ev){
    var raw;try{raw=JSON.parse(ev.data);}catch(e){return;}
    var d=raw&&raw.data;if(!d||!d.s)return;
    var sym=d.s.replace('USDT','');if(D[sym])D[sym].fund=+d.r||0;
  };
  ws.onerror=function(){};ws.onclose=function(){setTimeout(connectFundingWS,5000);};
}

// Backend WS
var BK_URL='wss://qmis-backend.onrender.com/ws';
function connectBackend(){
  try{
    bkWS=new WebSocket(BK_URL);
    bkWS.onopen=function(){
      usingBk=true;bkRetry=0;
      setStatus('live','14 BIRJA LIVE');
      var liveCnt=0;
      VENUES.forEach(function(v){
        if(v.id!=='binance'){vSt[v.id]='live';liveCnt++;}
      });
      renderVBar();
      rAddMsg('Backend ulandi! 14 birja real data kelmoqda.','sig');
    };
    bkWS.onmessage=function(ev){
      var data;try{data=JSON.parse(ev.data);}catch(e){return;}
      if(data.type==='venues'){
        Object.keys(data.data).forEach(function(id){
          var s=data.data[id];
          vSt[id]=s==='live'?'live':s==='error'?'err':'conn';
        });
        renderVBar();
        return;
      }
      if(data.type==='prices'){
        Object.keys(data.data).forEach(function(sym){
          if(!D[sym])return;
          var d=data.data[sym];
          var prev=D[sym].price;
          if(d.p)D[sym].price=d.p;
          if(d.ch)D[sym].ch=d.ch;
          if(d.v)D[sym].vol=d.v;
          if(d.hi)D[sym].hi=d.hi;
          if(d.lo)D[sym].lo=d.lo;
          if(d.f)D[sym].fund=d.f;
          if(D[sym].price>0&&prev>0){
            H[sym].push(D[sym].price);if(H[sym].length>120)H[sym].shift();
            PD[sym].push(D[sym].price-prev);
            VD[sym].push(Math.abs(D[sym].vol)*0.0001+0.001);
            if(PD[sym].length>50){PD[sym].shift();VD[sym].shift();}
            if(D[sym].ch>0)BV[sym]+=D[sym].vol*0.001;
            else SV[sym]+=D[sym].vol*0.001;
            CVD[sym]=BV[sym]-SV[sym];
            loaded++;
          }
        });
        se('hc',Math.min(loaded,SYMS.length)+'/'+SYMS.length);
        return;
      }
      if(data.type==='ping')try{bkWS.send(JSON.stringify({type:'pong'}));}catch(e){}
    };
    bkWS.onerror=function(){usingBk=false;};
    bkWS.onclose=function(){
      usingBk=false;
      bkRetry++;
      VENUES.forEach(function(v){if(v.id!=='binance')vSt[v.id]='conn';});
      renderVBar();
      setTimeout(connectBackend,Math.min(bkRetry*3000,30000));
    };
  }catch(e){usingBk=false;}
}

// Keep backend alive
function wakeBackend(){
  var img=new Image();

}

// G — global
window.G={
  sel:function(sym){
    SEL=sym;
    connectDepthWS(sym);
    connectTradeWS(sym);
    renderDetail(sym);
    rank();

  srch:function(q){
    clearTimeout(srchT);
    srchT=setTimeout(function(){doSearch(q);},150);
  },
  srchKey:function(e){
    if(e.key==='Enter'){
      var q=($('sinp')||{}).value;
      if(q){
        var sym=q.toUpperCase();
        if(SYMS.indexOf(sym)>=0)G.srchSel(sym);
        else G.srchAsk();
      }
    }
    if(e.key==='Escape'){var d=$('sdrop');if(d)d.className='sdrop';}
  },
  srchSel:function(sym){
    var inp=$('sinp');if(inp)inp.value=sym;
    var drop=$('sdrop');if(drop)drop.className='sdrop';
    G.sel(sym);
    G.rOpen();
    rProcess(sym+' tahlil');
  },
  srchAsk:function(){
    var inp=$('sinp'),q=inp&&inp.value.trim();
    if(!q)return;
    var drop=$('sdrop');if(drop)drop.className='sdrop';
    var sym=q.toUpperCase();
    if(SYMS.indexOf(sym)>=0){G.srchSel(sym);}
    else{G.rOpen();rProcess(q);if(inp)inp.value='';}
  },
  rOpen:function(){
    var m=$('rmodal');if(m)m.classList.add('open');
    unread=0;
    var b=$('rbadge');if(b)b.className='rfab-badge';
    if(rmsgEl)rmsgEl.scrollTop=rmsgEl.scrollHeight;
    setTimeout(function(){var i=$('rinp');if(i)i.focus();},300);
  },
  rClose:function(){
    var m=$('rmodal');if(m)m.classList.remove('open');
  },
  rAsk:function(q){G.rOpen();setTimeout(function(){rProcess(q);},150);},
  rSend:function(){
    var inp=$('rinp'),q=inp&&inp.value.trim();
    if(!q)return;
    if(inp)inp.value='';
    rProcess(q);
  },
};
